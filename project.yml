name: Proxyn
options:
  bundleIdPrefix: com.proxyn
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
      SWIFT_COMPILATION_MODE: wholemodule
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      VALIDATE_PRODUCT: YES

targets:
  Proxyn:
    type: application
    platform: iOS
    sources:
      - path: Proxyn
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: Proxyn
        PRODUCT_BUNDLE_IDENTIFIER: com.proxyn.app
        INFOPLIST_FILE: Proxyn/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Proxyn/Resources/Proxyn.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
    dependencies:
      - target: ProxynWidgets
        embed: true

  ProxynWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ProxynWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: ProxynWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.proxyn.app.widgets
        INFOPLIST_FILE: ProxynWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: ProxynWidgets/ProxynWidgets.entitlements
        SKIP_INSTALL: YES

schemes:
  Proxyn:
    build:
      targets:
        Proxyn: all
        ProxynWidgets: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
